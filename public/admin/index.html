<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Administration · Kapicua · Encárgalo</title>
<style>
@font-face{font-family:Inter;font-style:normal;font-weight:300;font-display:swap;src:url(/fonts-lux/inter-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(/fonts-lux/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:500;font-display:swap;src:url(/fonts-lux/cormorant-garamond-latin-500-normal.woff2) format('woff2')}
*{box-sizing:border-box}
body{margin:0;background:#f6f4f0;color:#111;font:300 14px/1.6 Inter,Arial,sans-serif}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;background:#111;color:#fff}
.top h1{font-size:20px;letter-spacing:.22em;text-transform:uppercase}
.wrap{max-width:1280px;margin:0 auto;padding:28px}
.card{background:#fff;border:1px solid #e3e0da;padding:28px}
.login{max-width:420px;margin:12vh auto}
.login h2{font-size:34px;margin-bottom:18px}
label{display:block;font:400 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:#5b5b5b;margin:0 0 6px}
input,select,textarea{width:100%;font:300 14px Inter,sans-serif;padding:9px 10px;border:1px solid #cfcac2;background:#fff;color:#111}
textarea{min-height:60px;resize:vertical}
button{font:400 11px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;background:#111;color:#fff;border:1px solid #111;padding:11px 18px;cursor:pointer}
button.o{background:#fff;color:#111}
button:disabled{opacity:.5}
.err{color:#8a2a1e;margin:12px 0 0}
.ok{color:#1f4d33}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{background:#fff;color:#111;border-color:#d8d4cc}
.tabs button.on{background:#111;color:#fff;border-color:#111}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.filters>div{min-width:160px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid #e3e0da;padding:16px}
.stat b{display:block;font:500 30px "Cormorant Garamond",serif}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8d8d8d}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e3e0da}
th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;vertical-align:top}
th{font:400 10.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:#8d8d8d;background:#fbfaf8}
td .muted{color:#8d8d8d;font-size:12.5px}
td a{color:#111}
.req td:nth-child(4){min-width:280px}
.edit{display:grid;gap:6px;min-width:220px}
.tag{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid #111;padding:3px 7px}
.tag.encargalo{background:#111;color:#fff}
.data{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
@media(max-width:800px){table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{border-bottom:1px solid #ddd;padding:8px 0}td{border:0;padding:6px 12px}}
</style>
</head>
<body>
<div class="top"><h1>Administration</h1><button type="button" class="o" id="out" hidden>Déconnexion</button></div>
<div class="wrap" id="app">
  <form class="card login" id="loginForm">
    <h2>Connexion</h2>
    <label for="pw">Mot de passe administrateur</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p style="margin:16px 0 0"><button type="submit">Se connecter</button></p>
    <p class="err" id="lerr" role="alert"></p>
  </form>
</div>
<script>
(function () {
  "use strict";
  var API = "/compte/api/", D = null, tab = "requests", fSite = "", fStatus = "";
  var LBL = { "new": "Nouvelle", preparing: "En préparation", ready: "Pilote prêt", won: "Validée", closed: "Clôturée", quoted: "Devis envoyé", paid: "Payée", ordered: "Achetée", shipped: "En route", delivered: "Livrée", cancelled: "Annulée" };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function api(p, m, b) {
    var o = { method: m || "GET", credentials: "same-origin", headers: {} };
    if (b !== undefined) { o.headers["content-type"] = "application/json"; o.body = JSON.stringify(b); }
    return fetch(API + p, o).then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: "network" }; });
  }
  function d(s) { try { return new Date(s).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }); } catch (e) { return s; } }
  function rd(n) { return "RD$" + Math.round(n || 0).toLocaleString("en-US"); }
  function wa(p) { var n = String(p || "").replace(/\D/g, ""); return n.length >= 8 ? '<a href="https://wa.me/' + n + '" target="_blank" rel="noopener noreferrer">' + esc(p) + "</a>" : esc(p); }
  function safeLink(u) { return /^https?:\/\//i.test(u || "") ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer nofollow">' + esc(u.length > 70 ? u.slice(0, 70) + "…" : u) + "</a>" : ""; }
  function detail(r) {
    var x = r.data || {};
    if (r.kind === "pilote") return '<div class="data"><b>' + esc(x.company) + "</b>" + (x.sector ? "\nSecteur : " + esc(x.sector) : "") + (x.city ? "\nVille : " + esc(x.city) : "") + (x.website ? "\nSite / réseaux : " + esc(x.website) : "") + (x.message ? "\n\n" + esc(x.message) : "") + "</div>";
    return '<div class="data">' + safeLink(x.link) + "\nPrix : US$" + esc(x.price) + " × " + esc(x.qty) + " · " + esc(x.lb) + " lb\nLivraison : " + (x.delivery ? "à domicile" : "retrait") + "\nTotal estimé : <b>" + rd(x.total) + "</b>" + (x.notes ? "\n" + esc(x.notes) : "") + "</div>";
  }
  function csv(rows, cols) {
    var s = cols.join(";") + "\n" + rows.map(function (r) { return cols.map(function (c) { var v = r[c]; if (v && typeof v === "object") v = JSON.stringify(v); v = String(v == null ? "" : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }).join(";"); }).join("\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + s], { type: "text/csv;charset=utf-8" }));
    a.download = tab + "-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  }
  function view() {
    var app = $("app");
    var reqs = D.requests.filter(function (r) { return (!fSite || r.site === fSite) && (!fStatus || r.status === fStatus); });
    var open = D.requests.filter(function (r) { return ["new", "preparing", "quoted", "paid", "ordered", "shipped"].indexOf(r.status) >= 0; }).length;
    var h = '<div class="stats"><div class="stat"><b>' + D.requests.filter(function (r) { return r.status === "new"; }).length + '</b><span>Nouvelles demandes</span></div><div class="stat"><b>' + open + '</b><span>En cours</span></div><div class="stat"><b>' + D.users.length + '</b><span>Comptes</span></div><div class="stat"><b>' + (D.subscribers.length + D.users.filter(function (u) { return u.newsletter; }).length) + '</b><span>Inscrits newsletter</span></div></div>' +
      '<div class="tabs">' + [["requests", "Demandes"], ["users", "Comptes"], ["subscribers", "Newsletter"]].map(function (t) { return '<button type="button" data-tab="' + t[0] + '" class="' + (tab === t[0] ? "on" : "") + '">' + t[1] + "</button>"; }).join("") + '<button type="button" class="o" id="exp">Exporter CSV</button><button type="button" class="o" id="ref">Actualiser</button></div>';
    if (tab === "requests") {
      var sts = fSite ? D.statuses[fSite] : D.statuses.kapicua.concat(D.statuses.encargalo.filter(function (s) { return D.statuses.kapicua.indexOf(s) < 0; }));
      h += '<div class="filters"><div><label for="fs">Site</label><select id="fs"><option value="">Tous</option><option value="kapicua"' + (fSite === "kapicua" ? " selected" : "") + '>Kapicua</option><option value="encargalo"' + (fSite === "encargalo" ? " selected" : "") + '>Encárgalo</option></select></div><div><label for="ft">Statut</label><select id="ft"><option value="">Tous</option>' + sts.map(function (s) { return '<option value="' + s + '"' + (fStatus === s ? " selected" : "") + ">" + LBL[s] + "</option>"; }).join("") + "</select></div></div>";
      h += '<table class="req"><thead><tr><th>Date</th><th>Site</th><th>Client</th><th>Demande</th><th>Suivi (visible par le client)</th></tr></thead><tbody>' + (reqs.length ? reqs.map(function (r) {
        return '<tr data-id="' + esc(r.id) + '"><td>' + d(r.created_at) + '<div class="muted">màj ' + d(r.updated_at) + '</div></td><td><span class="tag ' + esc(r.site) + '">' + (r.site === "kapicua" ? "Kapicua" : "Encárgalo") + '</span></td><td><b>' + esc(r.name || "—") + "</b>" + (r.company ? "<br>" + esc(r.company) : "") + '<div class="muted"><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + "</a><br>" + wa(r.phone) + " · " + esc(r.lang) + "</div></td><td>" + detail(r) + '</td><td><div class="edit"><select data-k="status">' + D.statuses[r.site].map(function (s) { return '<option value="' + s + '"' + (r.status === s ? " selected" : "") + ">" + LBL[s] + "</option>"; }).join("") + '</select><input data-k="price" placeholder="Prix confirmé (ex. RD$3,450 ou 290 €)" value="' + esc(r.price) + '" maxlength="40"><textarea data-k="note" placeholder="Message au client" maxlength="600">' + esc(r.note) + '</textarea><button type="button" data-save>Enregistrer</button><span class="muted" data-msg></span></div></td></tr>';
      }).join("") : '<tr><td colspan="5">Aucune demande.</td></tr>') + "</tbody></table>";
    } else if (tab === "users") {
      h += "<table><thead><tr><th>Créé le</th><th>Site</th><th>Nom</th><th>Entreprise</th><th>Contact</th><th>Newsletter</th></tr></thead><tbody>" + (D.users.length ? D.users.map(function (u) { return "<tr><td>" + d(u.created_at) + '</td><td><span class="tag ' + esc(u.site) + '">' + esc(u.site) + "</span></td><td>" + esc(u.name) + "</td><td>" + esc(u.company) + '</td><td><a href="mailto:' + esc(u.email) + '">' + esc(u.email) + "</a><br>" + wa(u.phone) + "</td><td>" + (u.newsletter ? "Oui" : "—") + "</td></tr>"; }).join("") : '<tr><td colspan="6">Aucun compte.</td></tr>') + "</tbody></table>";
    } else {
      h += "<table><thead><tr><th>Date</th><th>Site</th><th>E-mail</th><th>Langue</th></tr></thead><tbody>" + (D.subscribers.length ? D.subscribers.map(function (s) { return "<tr><td>" + d(s.created_at) + '</td><td><span class="tag ' + esc(s.site) + '">' + esc(s.site) + '</span></td><td><a href="mailto:' + esc(s.email) + '">' + esc(s.email) + "</a></td><td>" + esc(s.lang) + "</td></tr>"; }).join("") : '<tr><td colspan="4">Aucun inscrit via le formulaire (les comptes qui ont coché la newsletter sont dans l’onglet Comptes).</td></tr>') + "</tbody></table>";
    }
    app.innerHTML = h;
  }
  function load() {
    return api("admin/data").then(function (r) {
      if (!r.ok) { if (r.error === "login_required") location.reload(); return; }
      D = r; $("out").hidden = false; view();
    });
  }
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.dataset.tab) { tab = t.dataset.tab; view(); }
    if (t.id === "ref") load();
    if (t.id === "exp") {
      if (tab === "requests") csv(D.requests.map(function (r) { var o = Object.assign({}, r); o.data = r.data; return o; }), ["created_at", "site", "kind", "status", "price", "note", "name", "company", "email", "phone", "lang", "data"]);
      else if (tab === "users") csv(D.users, ["created_at", "site", "name", "company", "email", "phone", "lang", "newsletter"]);
      else csv(D.subscribers, ["created_at", "site", "email", "lang"]);
    }
    if (t.hasAttribute("data-save")) {
      var tr = t.closest("tr"), id = tr.dataset.id, msg = tr.querySelector("[data-msg]");
      var b = { id: id, status: tr.querySelector('[data-k="status"]').value, price: tr.querySelector('[data-k="price"]').value, note: tr.querySelector('[data-k="note"]').value };
      t.disabled = true;
      api("admin/request", "PATCH", b).then(function (r) {
        t.disabled = false;
        if (r.ok) { var x = D.requests.find(function (q) { return q.id === id; }); Object.assign(x, { status: b.status, price: b.price, note: b.note, updated_at: new Date().toISOString() }); msg.textContent = "Enregistré"; msg.className = "ok"; }
        else { msg.textContent = "Erreur : " + r.error; msg.className = "err"; }
      });
    }
    if (t.id === "out") api("logout", "POST", { site: "admin" }).then(function () { location.reload(); });
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "fs") { fSite = e.target.value; fStatus = ""; view(); }
    if (e.target.id === "ft") { fStatus = e.target.value; view(); }
  });
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var b = e.target.querySelector("button"); b.disabled = true; $("lerr").textContent = "";
    api("admin/login", "POST", { password: $("pw").value }).then(function (r) {
      b.disabled = false;
      if (r.ok) load();
      else $("lerr").textContent = r.error === "too_many" ? "Trop de tentatives, réessayez dans 15 minutes." : r.error === "bad_credentials" ? "Mot de passe incorrect." : "Service indisponible.";
    });
  });
  api("admin/data").then(function (r) { if (r.ok) { D = r; $("out").hidden = false; view(); } });
})();
</script>
</body>
</html>
